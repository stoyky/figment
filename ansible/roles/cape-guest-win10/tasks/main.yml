---
- name: Mount vmtools ISO
  community.windows.win_disk_image:
    image_path: "C:\\Users\\{{ user }}\\vmtools.iso"
    state: present
  ignore_errors: true
  register: disk_image_out

- name: Install VMWare guest additions
  ansible.windows.win_package:
    path: "{{ disk_image_out.mount_paths[0] }}\\setup.exe"
    arguments: /S /v"/qn REBOOT=ReallySuppress"
    state: present
  when: source_type == 'vmware-iso'

- name: Install VirtualBox Guest Additions
  ansible.windows.win_shell: |
    Start-Process "{{ disk_image_out.mount_paths[0] }}\\VBoxWindowsAdditions.exe" -ArgumentList "/S" -Wait
  ignore_errors: true
  when: source_type == 'virtualbox-iso'

- name: Unmount ISO
  community.windows.win_disk_image:
    image_path: "C:\\Users\\{{ user }}\\vmtools.iso"
    state: absent
  ignore_errors: true

- name: Install Python >3.10 <3.13  32‑bit on Windows
  ansible.windows.win_package:
    path: https://www.python.org/ftp/python/3.10.11/python-3.10.11.exe
    state: present
    arguments: |
      InstallAllUsers=1
      PrependPath=1
      Include_doc=0
      Include_pip=1
      Include_test=0
      TargetDir=C:\Python310

- name: Download CAPE agent.py to desktop
  ansible.windows.win_get_url:
    url: https://github.com/kevoreilly/CAPEv2/tree/master/agent/agent.py
    dest: C:\Users\{{ user }}\Desktop\agent.py


- name: Pause before running agent
  ansible.builtin.pause:
    seconds: 20

- name: Ensure CAPE agent runs at logon with elevated privileges
  community.windows.win_scheduled_task:
    name: updater
    username: "{{ user }}"
    state: present
    password: "password"
    run_level: highest
    actions:
    - path: python.exe
      arguments: "C:\\Users\\{{ user }}\\Desktop\\agent.py"
      working_directory: "C:\\Users\\{{ user }}\\Desktop"
    triggers:
      - type: logon

- name: Run the updater task to start the agent
  win_command: schtasks /run /tn updater

- name: Rename NAT adapter (all providers)
  ansible.windows.win_shell: |
    $normMac = '{{ mac_nat }}' -replace '[:-]' -replace '(.{2})(.{2})(.{2})(.{2})(.{2})(.{2})', '$1-$2-$3-$4-$5-$6'
    $normMac = $normMac.ToUpper()
    $adapter = Get-NetAdapter | Where-Object { $_.MacAddress -eq $normMac } | Select-Object -First 1
    if ($adapter -and $adapter.Name -ne 'nat') {
      Rename-NetAdapter -Name $adapter.Name -NewName 'nat' -Confirm:$false
    }
  become: yes
  become_user: '{{ user }}'
  become_method: runas

- name: Rename host-only adapter (all providers)
  ansible.windows.win_shell: |
    $normMac = '{{ mac_hostonly }}' -replace '[:-]' -replace '(.{2})(.{2})(.{2})(.{2})(.{2})(.{2})', '$1-$2-$3-$4-$5-$6'
    $normMac = $normMac.ToUpper()
    $adapter = Get-NetAdapter | Where-Object { $_.MacAddress -eq $normMac } | Select-Object -First 1
    if ($adapter -and $adapter.Name -ne 'hostonly') {
      Rename-NetAdapter -Name $adapter.Name -NewName 'hostonly' -Confirm:$false
    }
  become: yes
  become_user: '{{ user }}'
  become_method: runas

- name: Configure static IP on host-only adapter
  ansible.windows.win_shell: |
    Get-NetIPAddress -InterfaceAlias 'hostonly' -AddressFamily IPv4 | 
      Remove-NetRoute -Confirm:$false -ErrorAction SilentlyContinue;
    Get-NetIPAddress -InterfaceAlias 'hostonly' -AddressFamily IPv4 | 
      Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue;
    New-NetIPAddress -InterfaceAlias 'hostonly' -IPAddress {{ hostonly_ip }} -PrefixLength 24 -DefaultGateway {{ default_gateway }} -AddressFamily IPv4;
  become: yes
  become_user: '{{ user }}'
  become_method: runas

- name: Set static DNS
  ansible.windows.win_dns_client:
    adapter_names: hostonly
    ipv4_addresses:
      - "{{ dns_ip }}"
  become: yes
  become_user: '{{ user }}'
  become_method: runas

- name: Reboot
  ansible.windows.win_reboot:
    msg: "Rebooting"
    reboot_timeout: 120
  ignore_errors: true

