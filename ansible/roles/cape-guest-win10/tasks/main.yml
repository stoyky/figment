---
- name: Install Python 3.10.11 32-bit
  ansible.windows.win_package:
    path: https://www.python.org/ftp/python/3.10.11/python-3.10.11.exe
    arguments: /quiet InstallAllUsers=1 PrependPath=1 Include_test=0 TargetDir=C:\Python310
    state: present

- name: Download CAPE agent.py
  ansible.windows.win_get_url:
    url: https://raw.githubusercontent.com/kevoreilly/CAPEv2/3eaf9b6260ad2edab8766bea72ddf35d80825dab/agent/agent.py
    dest: C:\Users\{{ user }}\Documents\updater.pyw


- name: Pause before running agent
  ansible.builtin.pause:
    seconds: 20

- name: Ensure CAPE agent runs at logon with elevated privileges
  community.windows.win_scheduled_task:
    name: updater
    username: "{{ user }}"
    state: present
    password: "password"
    run_level: highest
    actions:
    - path: "C:\\Python310\\pythonw.exe"
      arguments: "C:\\Users\\{{ user }}\\Documents\\updater.pyw"
      working_directory: "C:\\Users\\{{ user }}\\Documents"
    triggers:
      - type: logon

- name: Run the updater task to start the agent
  win_command: schtasks /run /tn updater
  become: true
  become_user: '{{ user }}'
  become_method: runas

- name: Disable Teredo for less noisy network traffic
  win_command: netsh interface teredo set state disabled
  become: true
  become_user: '{{ user }}'
  become_method: runas
  
- name: Rename NAT adapter (all providers)
  ansible.windows.win_shell: |
    $normMac = '{{ mac_nat }}' -replace '[:-]' -replace '(.{2})(.{2})(.{2})(.{2})(.{2})(.{2})', '$1-$2-$3-$4-$5-$6'
    $normMac = $normMac.ToUpper()
    $adapter = Get-NetAdapter | Where-Object { $_.MacAddress -eq $normMac } | Select-Object -First 1
    if ($adapter -and $adapter.Name -ne 'nat') {
      Rename-NetAdapter -Name $adapter.Name -NewName 'nat' -Confirm:$false
    }
  become: true
  become_user: '{{ user }}'
  become_method: runas

- name: Rename host-only adapter (all providers)
  ansible.windows.win_shell: |
    $normMac = '{{ mac_hostonly }}' -replace '[:-]' -replace '(.{2})(.{2})(.{2})(.{2})(.{2})(.{2})', '$1-$2-$3-$4-$5-$6'
    $normMac = $normMac.ToUpper()
    $adapter = Get-NetAdapter | Where-Object { $_.MacAddress -eq $normMac } | Select-Object -First 1
    if ($adapter -and $adapter.Name -ne 'hostonly') {
      Rename-NetAdapter -Name $adapter.Name -NewName 'hostonly' -Confirm:$false
    }
  become: true
  become_user: '{{ user }}'
  become_method: runas

- name: Configure static IP on host-only adapter
  ansible.windows.win_shell: |
    Get-NetIPAddress -InterfaceAlias 'hostonly' -AddressFamily IPv4 | 
      Remove-NetRoute -Confirm:$false -ErrorAction SilentlyContinue;
    Get-NetIPAddress -InterfaceAlias 'hostonly' -AddressFamily IPv4 | 
      Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue;
    New-NetIPAddress -InterfaceAlias 'hostonly' -IPAddress {{ hostonly_ip }} -PrefixLength 24 -DefaultGateway {{ default_gateway }} -AddressFamily IPv4;
  become: true
  become_user: '{{ user }}'
  become_method: runas

- name: Set static DNS
  ansible.windows.win_dns_client:
    adapter_names: hostonly
    ipv4_addresses:
      - "{{ dns_ip }}"
  become: true
  become_user: '{{ user }}'
  become_method: runas

- name: Disable EnableLUA
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: EnableLUA
    data: 0
    type: dword

- name: Disable ConsentPromptBehaviorAdmin
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: ConsentPromptBehaviorAdmin
    data: 0
    type: dword

- name: Disable PromptOnSecureDesktop
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: PromptOnSecureDesktop
    data: 0
    type: dword

- name: Reboot
  ansible.windows.win_reboot:
    msg: "Rebooting"
    reboot_timeout: 300

