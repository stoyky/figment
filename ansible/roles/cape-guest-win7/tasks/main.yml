---
- name: Install Python 3.10.11 32-bit
  ansible.windows.win_package:
    path: https://www.python.org/ftp/python/3.10.11/python-3.10.11.exe
    arguments: /quiet InstallAllUsers=1 PrependPath=1 Include_test=0 TargetDir=C:\Python310
    state: present

- name: Download CAPE agent.py
  ansible.windows.win_get_url:
    url: https://raw.githubusercontent.com/kevoreilly/CAPEv2/3eaf9b6260ad2edab8766bea72ddf35d80825dab/agent/agent.py
    dest: C:\Users\{{ user }}\Documents\updater.pyw

- name: Pause before running agent
  ansible.builtin.pause:
    seconds: 20

- name: Ensure CAPE agent runs at logon with elevated privileges
  community.windows.win_scheduled_task:
    name: updater
    username: "{{ user }}"
    state: present
    password: "password"
    run_level: highest
    actions:
    - path: "C:\\Python310\\pythonw.exe"
      arguments: "C:\\Users\\{{ user }}\\Documents\\updater.pyw"
      working_directory: "C:\\Users\\{{ user }}\\Documents"
    triggers:
      - type: logon

- name: Run the updater task to start the agent
  win_command: schtasks /run /tn updater
  become: true
  become_user: '{{ user }}'
  become_method: runas

- name: Disable Teredo for less noisy network traffic
  win_command: netsh interface teredo set state disabled
  become: true
  become_user: '{{ user }}'
  become_method: runas
  
- name: Ensure hostonly default gateway is set at boot
  community.windows.win_scheduled_task:
    name: Set Hostonly Gateway
    username: SYSTEM
    logon_type: service_account
    run_level: highest
    state: present
    enabled: true
    actions:
      - path: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        arguments: >-
          -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
          "$net=[ipaddress]'{{ hostonly_subnet }}'; $mask=[ipaddress]'{{ hostonly_netmask }}'; $gw='{{ hostonly_gateway }}';
          $nic=Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object {
            $ip=[ipaddress]$_.IPAddress;
            (($ip.Address -band $mask.Address) -eq ($net.Address -band $mask.Address))
          } | Select-Object -First 1;
          if ($nic) {
            Get-NetRoute -InterfaceIndex $nic.InterfaceIndex -DestinationPrefix '0.0.0.0/0' -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Remove-NetRoute -Confirm:$false -ErrorAction SilentlyContinue;
            New-NetRoute -InterfaceIndex $nic.InterfaceIndex -DestinationPrefix '0.0.0.0/0' -NextHop $gw -ErrorAction SilentlyContinue;
          }"
    triggers:
      - type: boot

- name: Run hostonly gateway task now
  ansible.windows.win_command: schtasks /run /tn "Set Hostonly Gateway"

- name: Enable autologon for local user
  ansible.windows.win_auto_logon:
    username: "{{ user }}"
    password: "{{ password }}"

- name: Disable EnableLUA
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: EnableLUA
    data: 0
    type: dword

- name: Disable ConsentPromptBehaviorAdmin
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: ConsentPromptBehaviorAdmin
    data: 0
    type: dword

- name: Disable PromptOnSecureDesktop
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: PromptOnSecureDesktop
    data: 0
    type: dword

# - name: Pause before rebooting
#   ansible.builtin.pause:
#     minutes: 5

- name: Reboot
  ansible.windows.win_reboot:
    msg: "Rebooting"
    reboot_timeout: 300

